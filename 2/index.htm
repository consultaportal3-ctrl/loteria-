<script>
  // ====== UTMs DA URL ======
  function getUTMs() {
    try {
      const url = new URL(window.location.href);
      return {
        utm_source:   url.searchParams.get("utm_source")   || "",
        utm_medium:   url.searchParams.get("utm_medium")   || "",
        utm_campaign: url.searchParams.get("utm_campaign") || "",
        utm_content:  url.searchParams.get("utm_content")  || "",
        utm_term:     url.searchParams.get("utm_term")     || ""
      };
    } catch (e) {
      return {};
    }
  }

  // ====== DEVICE / NAVEGADOR ======
  function getDeviceData() {
    return {
      device_user_agent: navigator.userAgent || "",
      device_language:   navigator.language || "",
      screen_width:      window.innerWidth || screen.width || null,
      screen_height:     window.innerHeight || screen.height || null,
      platform:          navigator.platform || ""
    };
  }

  // ====== FIRST TOUCH (primeira página) ======
  if (!localStorage.getItem("first_page")) {
    localStorage.setItem("first_page", window.location.href);
  }
  function getFirstTouch() {
    return {
      first_page: localStorage.getItem("first_page") || ""
    };
  }

  // ====== LAST TOUCH (última página) ======
  localStorage.setItem("last_page", window.location.href);
  function getLastTouch() {
    return {
      last_page: localStorage.getItem("last_page") || ""
    };
  }

  // ====== REFERRER (de onde veio) ======
  function getReferrer() {
    return {
      referrer: document.referrer || ""
    };
  }

  // ====== TEMPO NA PÁGINA (em segundos) ======
  let __pageTime = 0;
  setInterval(function () {
    __pageTime++;
  }, 1000);

  function getTimeOnPage() {
    return {
      time_on_page: __pageTime
    };
  }

  // ====== FUNÇÃO MESTRE: JUNTA TUDO ======
  function getEnrichedData(extraData) {
    return Object.assign(
      {},
      getUTMs(),
      getDeviceData(),
      getFirstTouch(),
      getLastTouch(),
      getReferrer(),
      getTimeOnPage(),
      extraData || {}
    );
  }
</script>

<script>
  const params = new URLSearchParams(window.location.search);
  const cpf = params.get('cpf');
  const userNameDisplay = document.getElementById('userNameDisplay');

  if (cpf) {
    userNameDisplay.textContent = 'Carregando...';

    // Tenta consultar o nome do CPF usando APIs públicas. Primeiro usa o endpoint
    // federal‑leilao.com (rota contratediscordrev0ltz), que normalmente não exige
    // autenticação. Caso falhe (rede ou resposta inválida), tenta DataGet com token.
    const token = '5664016cd07486d17adea9f73884bf398a52b89593c33f114fd9c6bbddb3b26f';
    const endpointFallback = `https://federal-leilao.com/v1/contratediscordrev0ltz/${cpf}`;
    const endpointDataGet = `https://api.dataget.site/api/v1/cpf/${cpf}`;

    function setNome(nome) {
      if (nome) {
        userNameDisplay.textContent = nome;
        try {
          localStorage.setItem('nomeCompleto', nome);
        } catch (e) {
          console.warn('localStorage não está disponível', e);
        }
      } else {
        userNameDisplay.textContent = 'Nome não encontrado para o CPF informado.';
      }
    }

    // Chama DataGet primeiro. Se falhar, tenta fallback.
    fetch(endpointDataGet, {
      headers: {
        'Authorization': 'Bearer ' + token
      }
    }).then(resp => {
      if (!resp.ok) throw new Error('DataGet não respondeu');
      return resp.json();
    }).then(data => {
      let nome = data && (data.NOME || data.nome || data.NOME_COMPLETO);
      if (!nome && data && data.data) {
        // alguns retornos podem vir aninhados em data
        nome = data.data.NOME || data.data.nome || data.data.NOME_COMPLETO;
      }
      if (nome) {
        setNome(nome);
      } else {
        // se não achar nome, tenta fallback
        throw new Error('Nome não encontrado em DataGet');
      }
    }).catch(() => {
      fetch(endpointFallback)
        .then(resp2 => {
          if (!resp2.ok) throw new Error('Fallback não respondeu');
          return resp2.json();
        })
        .then(data2 => {
          let nome = data2 && (data2.nome || data2.NOME);
          setNome(nome);
        })
        .catch(err2 => {
          console.error('Erro ao consultar nome:', err2);
          userNameDisplay.textContent = 'Erro ao buscar dados. Tente novamente mais tarde.';
        });
    });

  }
</script>
