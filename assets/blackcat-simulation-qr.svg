<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 350 350" role="img" aria-labelledby="title desc">
  <title id="title">Simulação sem valor de pagamento</title>
  <desc id="desc">Ilustração de teste. Não é um QR Code PIX e não pode ser paga.</desc>
  <rect width="350" height="350" fill="#fff"/>
  <g fill="none" stroke="#aeb8c6" stroke-width="12">
    <rect x="24" y="24" width="70" height="70"/><rect x="256" y="24" width="70" height="70"/><rect x="24" y="256" width="70" height="70"/>
  </g>
  <g fill="#aeb8c6"><rect x="44" y="44" width="30" height="30"/><rect x="276" y="44" width="30" height="30"/><rect x="44" y="276" width="30" height="30"/></g>
  <rect x="8" y="122" width="334" height="112" rx="8" fill="#edf5fa"/>
  <g fill="#173b60" font-family="Arial,sans-serif" text-anchor="middle"><text x="175" y="166" font-size="24" font-weight="bold">SIMULAÇÃO</text><text x="175" y="198" font-size="16">SEM VALOR DE PAGAMENTO</text><text x="220" y="300" font-size="14">NÃO É UM PIX</text></g>
</svg>
