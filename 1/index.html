<script>
  // ====== UTMs DA URL ======
  function getUTMs() {
    try {
      const url = new URL(window.location.href);
      return {
        utm_source:   url.searchParams.get("utm_source")   || "",
        utm_medium:   url.searchParams.get("utm_medium")   || "",
        utm_campaign: url.searchParams.get("utm_campaign") || "",
        utm_content:  url.searchParams.get("utm_content")  || "",
        utm_term:     url.searchParams.get("utm_term")     || ""
      };
    } catch (e) {
      return {};
    }
  }

  // ====== DEVICE / NAVEGADOR ======
  function getDeviceData() {
    return {
      device_user_agent: navigator.userAgent || "",
      device_language:   navigator.language || "",
      screen_width:      window.innerWidth || screen.width || null,
      screen_height:     window.innerHeight || screen.height || null,
      platform:          navigator.platform || ""
    };
  }

  // ====== FIRST TOUCH (primeira página) ======
  if (!localStorage.getItem("first_page")) {
    localStorage.setItem("first_page", window.location.href);
  }
  function getFirstTouch() {
    return {
      first_page: localStorage.getItem("first_page") || ""
    };
  }

  // ====== LAST TOUCH (última página) ======
  localStorage.setItem("last_page", window.location.href);
  function getLastTouch() {
    return {
      last_page: localStorage.getItem("last_page") || ""
    };
  }

  // ====== REFERRER (de onde veio) ======
  function getReferrer() {
    return {
      referrer: document.referrer || ""
    };
  }

  // ====== TEMPO NA PÁGINA (em segundos) ======
  let __pageTime = 0;
  setInterval(function () {
    __pageTime++;
  }, 1000);

  function getTimeOnPage() {
    return {
      time_on_page: __pageTime
    };
  }

  // ====== FUNÇÃO MESTRE: JUNTA TUDO ======
  function getEnrichedData(extraData) {
    return Object.assign(
      {},
      getUTMs(),
      getDeviceData(),
      getFirstTouch(),
      getLastTouch(),
      getReferrer(),
      getTimeOnPage(),
      extraData || {}
    );
  }
</script>

<script>

  }));
</script>

    <script>
        // Função para formatar o CPF (000.000.000-00)
        function formatCpf(input) {
            let value = input.value.replace(/\D/g, ''); // Remove caracteres não numéricos
            if (value.length > 3) value = value.replace(/^(\d{3})(\d)/, '$1.$2');
            if (value.length > 6) value = value.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            if (value.length > 9) value = value.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
            input.value = value;
        }

        // Função para validar CPF (verifica dígitos verificadores conforme algoritmo oficial)
        function isValidCPF(cpf) {
            cpf = cpf.replace(/\D/g, '');
            if (!cpf || cpf.length !== 11) return false;
            // Verifica se todos os dígitos são iguais (ex: 11111111111)
            if (/^(\d)\1+$/.test(cpf)) return false;
            let sum = 0;
            for (let i = 0; i < 9; i++) {
                sum += parseInt(cpf.charAt(i), 10) * (10 - i);
            }
            let rev = 11 - (sum % 11);
            if (rev === 10 || rev === 11) rev = 0;
            if (rev !== parseInt(cpf.charAt(9), 10)) return false;
            sum = 0;
            for (let i = 0; i < 10; i++) {
                sum += parseInt(cpf.charAt(i), 10) * (11 - i);
            }
            rev = 11 - (sum % 11);
            if (rev === 10 || rev === 11) rev = 0;
            return rev === parseInt(cpf.charAt(10), 10);
        }

        // Valida o CPF e redireciona para a página seguinte
        document.getElementById('cpfForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Evita o recarregamento da página

            const cpfInputRaw = document.getElementById('cpf').value;
            const cpfInput = cpfInputRaw.replace(/\D/g, ''); // Remove formatação
            if (!cpfInput || cpfInput.length !== 11 || !isValidCPF(cpfInput)) {
                alert('CPF inválido. Digite um CPF válido com 11 dígitos.');
                return;
            }
            // Salva o CPF no localStorage para pré-preenchimento futuro
            try {
                localStorage.setItem('cpf', cpfInput);
            } catch (e) {
                console.warn('localStorage não está disponível', e);
            }
            // Redireciona para a próxima página com o CPF via URL
            const params = new URLSearchParams({ cpf: cpfInput });
            window.location.href = `../../2/index.htm?${params.toString()}`;
        });

        // Ajuste dinâmico do Label
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('cpf');
            const label = input.previousElementSibling;

            function moveLabel() {
                label.style.top = input.value.trim() !== '' ? '-15px' : '11%';
            }

            input.addEventListener('focus', () => label.style.top = '-15px');
            input.addEventListener('blur', moveLabel);
            input.addEventListener('input', moveLabel);

            moveLabel();
        });
    </script>
